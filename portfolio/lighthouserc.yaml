ci:
  collect:
    # アダプターを使うと、ビルド時に作るページは dist/client/ に出る。場所を変えるときは、e2e/pages.spec.ts のページを集める場所も合わせる
    staticDistDir: dist/client
    # ページを足しても検査し忘れないよう、ビルドしたすべてのページを検査する。
    # 数の上限は 0 で外せるが、フォルダの深さは 0 を既定の 2 として扱うため、無限大にする
    # https://github.com/GoogleChrome/lighthouse-ci/blob/v0.16.1/packages/cli/src/collect/collect.js#L193-L200
    maxAutodiscoverUrls: 0
    staticDirFileDiscoveryDepth: .inf
    settings:
      # コンテナの一般ユーザーで Chromium のサンドボックスを使うには、Docker に専用の seccomp のプロファイルが要るため
      # https://github.com/microsoft/playwright/blob/v1.65.1/docs/src/docker.md?plain=1#L80
      chromeFlags: --no-sandbox
  assert:
    assertions:
      "categories:accessibility":
        - error
        - minScore: 1
      "categories:best-practices":
        - error
        - minScore: 1
      "categories:seo":
        - error
        - minScore: 1
      # AI エージェントがページを読み取り、操作できるかを見る。Lighthouse 13.6 で入ったカテゴリなので、更新で項目が変わって失敗したら、基準を見直す
      # https://github.com/GoogleChrome/lighthouse/blob/v13.6.0/core/config/default-config.js#L646-L659
      "categories:agentic-browsing":
        - error
        - minScore: 1
      # 性能の点数は、検査するマシンの負荷で揺れるため、失敗させずに知らせるだけにする
      "categories:performance":
        - warn
        - minScore: 0.9
      # 点数より揺れにくい配信サイズで、大きな増加を止める。値は圧縮後の転送サイズのバイト数で、lhci の静的サーバーは gzip で返す
      # https://github.com/GoogleChrome/lighthouse-ci/blob/v0.16.1/packages/utils/src/assertions.js#L336-L356 https://github.com/GoogleChrome/lighthouse-ci/blob/v0.16.1/packages/cli/src/collect/fallback-server.js#L30
      "resource-summary:total:size":
        - error
        - maxNumericValue: 512000 # 500 KiB
      "resource-summary:script:size":
        - error
        - maxNumericValue: 153600 # 150 KiB
      "resource-summary:stylesheet:size":
        - error
        - maxNumericValue: 51200 # 50 KiB
      "resource-summary:image:size":
        - error
        - maxNumericValue: 307200 # 300 KiB
      "resource-summary:font:size":
        - error
        - maxNumericValue: 102400 # 100 KiB
      # ほかのオリジンへのリクエストを足したら止め、意図したものかを確認する
      "resource-summary:third-party:count":
        - error
        - maxNumericValue: 0
  upload:
    target: filesystem
    # 変えるときは、portfolio/.gitignore と、portfolio-check.yml の --upload.outputDir と成果物の path も合わせる
    outputDir: lighthouse-report
