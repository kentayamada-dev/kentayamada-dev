# storeDir・allowBuilds・trustPolicyExclude のほかは .github/textlint/pnpm-workspace.yaml と同じ設定にする。それぞれの理由は、そちらのコメントにある
engineStrict: true
saveExact: true
minimumReleaseAge: 1440
minimumReleaseAgeIgnoreMissingTime: false
trustPolicy: no-downgrade
registries:
  https://npm.flatt.tech/:
    scopes: ["@", "@jsr"]
  https://npmjs.invalid/:
    prefix: npmjs
  https://gh.invalid/:
    prefix: gh
# コンテナでは node_modules と同じボリュームに置き、ハードリンクできるようにする。指定しないと、/workspace のバインドマウントの直下（リポジトリのルート）に作るため
# https://pnpm.io/settings/store
storeDir: node_modules/.pnpm-store
# vnu-jar のインストールスクリプトは、Java がないと Java を取得する。Java は compose.yaml の html-checker のイメージのものを使うため、動かさない
# https://github.com/validator/validator/blob/14c5cc7f0d6f8cc140d31c73a0b3ee4e80408d2d/vnu-java-downloader.js#L268-L287 https://pnpm.io/settings/build#allowbuilds
allowBuilds:
  vnu-jar: false
# @lhci/cli が使う lighthouse の依存の chromium-bidi は、157.0.8090-0 から provenance なしで公開され、trustPolicy に拒否されるため。公開のしかたが変わった理由は未確認。
# 版ごとに除外するので、lighthouse を上げて chromium-bidi の版が変わったら、その版の公開元を確認してから書き換える
# https://registry.npmjs.org/chromium-bidi/157.0.8090-0 https://pnpm.io/settings/dependency-resolution#trustpolicyexclude
trustPolicyExclude:
  - chromium-bidi@157.0.8090-0
