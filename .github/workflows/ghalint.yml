name: ワークフローの規約

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  ghalint:
    name: ghalint
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          install_args: github:suzuki-shunsuke/ghalint
      - run: ghalint run
      # ghalint run はワークフローしか検査しないため、アクションの定義（action.yml）は run-action で検査する
      # https://github.com/suzuki-shunsuke/ghalint/blob/v1.5.6/README.md#2-validate-actionyaml
      - run: ghalint run-action
