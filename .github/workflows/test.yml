name: シェルスクリプトの静的解析・テスト

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      - uses: $/.github/actions/setup-mise
        with:
          # bats のテストは gh をスタブに置き換えるが、スクリプトとスタブが使う jq は本物なので入れる
          install_args: shellcheck github:mvdan/sh bats jq
      # shellcheck は渡したファイルしか検査せず、shfmt はディレクトリを渡すと拡張子のない shebang のファイルまで対象にするため、find で同じファイルを渡す
      # https://github.com/koalaman/shellcheck/blob/v0.11.0/shellcheck.1.md https://github.com/mvdan/sh/blob/v3.14.1/fileutil/file.go#L67-L84
      # 検査の失敗が find の終了コードに伝わるのは -exec の + の形だけのため、; の形にしない
      - run: >-
          find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name '*.bats' \)
          -exec shellcheck --enable=all {} +
      - run: >-
          find . -path ./.git -prune -o -type f \( -name '*.sh' -o -name '*.bats' \)
          -exec shfmt --diff {} +
      # -r は . で始まるディレクトリも含めて、サブディレクトリの .bats を集める https://github.com/bats-core/bats-core/blob/v1.14.0/libexec/bats-core/bats#L501-L504
      - run: bats -r .
        env:
          # v1.14.0 は UTF-8 ロケールだと日本語のテスト名の一部を実行しない https://github.com/bats-core/bats-core/issues/1233
          LC_ALL: C
