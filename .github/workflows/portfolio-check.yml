name: portfolio の型・静的解析・ビルド・ページの検査

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  portfolio-check:
    name: portfolio-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    env:
      lighthouse_results: portfolio/.lighthouseci/assertion-results.json
      # warn にした基準を満たさなかったアサーションを、警告の注釈にする jq のプログラム。$form_factor に計測の種類を渡す
      lighthouse_warnings: >-
        .[] | select(.level == "warn")
        | "::warning title=Lighthouse（\($form_factor)）の基準を満たしません::\(.url) の \(.auditProperty // .auditId) が \(.actual)（基準は \(.operator) \(.expected)）"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # Node.js と pnpm の版を portfolio の Dockerfile だけで管理するため、Dev Container と同じイメージのなかで検査する。
      # Dockerfile の ARG の値は compose.yaml から渡すため、docker build ではなく Compose でビルドする
      - run: docker compose build portfolio
      - run: docker compose run --rm portfolio pnpm install --frozen-lockfile
      # コンテナの dev の uid はランナーの uid と一致するとは限らないため、どの uid でも .astro や dist と、見た目の比較に使う画像を作れるようにする
      - run: chmod a+w portfolio portfolio/e2e
      - run: docker compose run --rm portfolio pnpm fmt:check
        continue-on-error: true
      - run: docker compose run --rm portfolio pnpm lint
        continue-on-error: true
      # astro build は型を検査せず、型の誤りがあってもビルドが通るため、別のステップで検査する
      # https://docs.astro.build/en/guides/typescript/#type-checking
      - run: docker compose run --rm portfolio pnpm typecheck
        continue-on-error: true
      - run: docker compose run --rm portfolio pnpm knip
        continue-on-error: true
      # ブラウザのサーバーは portfolio の node_modules にある Playwright で動くため、pnpm install の後に起動する
      - run: docker compose up --detach --wait playwright
      # テストはビルドし直したページを開くので、ビルドも兼ねる。整形・lint・型の検査が通っても、ビルドでページを事前にレンダリングするときに初めて失敗することもある
      - id: e2e
        run: docker compose run --rm portfolio pnpm test:e2e
      # 失敗したときは、原因を見られるレポートを上げる
      - if: failure() && steps.e2e.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: portfolio/playwright-report/
      # HTML の検査と Lighthouse は、ビルドし直さずに、テストのステップでビルドした dist を検査する
      - run: docker compose run --rm html-checker
      # 性能の点数のように、失敗させない基準を満たさなかったときも、注釈で知らせるために使う
      - uses: $/.github/actions/setup-mise
        with:
          install_args: jq
      # Lighthouse はモバイルとデスクトップで別々に計測する。アサーションの結果は計測ごとに上書きされるため、注釈は計測の直後に出す
      - id: lighthouse-mobile
        run: docker compose run --rm lighthouse --upload.outputDir=lighthouse-report/mobile
      - if: steps.lighthouse-mobile.outcome == 'success'
        run: jq --raw-output --arg form_factor モバイル "$lighthouse_warnings" "$lighthouse_results"
      # モバイルで失敗しても、デスクトップの結果も見られるよう計測する
      - id: lighthouse-desktop
        if: ${{ !cancelled() && steps.lighthouse-mobile.outcome != 'skipped' }}
        run: docker compose run --rm lighthouse --collect.settings.preset=desktop --upload.outputDir=lighthouse-report/desktop
      - if: steps.lighthouse-desktop.outcome == 'success'
        run: jq --raw-output --arg form_factor デスクトップ "$lighthouse_warnings" "$lighthouse_results"
      # 検証用。フォントの転送サイズ・CLS・性能の点数をレポートごとに出す
      - if: ${{ !cancelled() && steps.lighthouse-mobile.outcome != 'skipped' }}
        run: >-
          find portfolio/lighthouse-report -name '*.json' ! -name 'manifest.json' -print0
          | xargs -0 jq -r '[.configSettings.formFactor, .finalDisplayedUrl,
          ([.audits["resource-summary"].details.items[] | select(.resourceType == "font") | .transferSize] | first),
          .audits["cumulative-layout-shift"].numericValue, .categories.performance.score] | @tsv'
      # 失敗させない基準の詳細も見られるよう、成否によらずレポートを上げる
      - if: ${{ !cancelled() && steps.lighthouse-mobile.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7.0.2
        with:
          name: lighthouse-report
          path: portfolio/lighthouse-report/
      - id: visual
        run: docker compose run --rm portfolio pnpm test:visual
      # 失敗したときは、ブラウザごとの差分の画像を見られるレポートを上げる
      - if: failure() && steps.visual.outcome == 'failure'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-visual-report
          path: portfolio/playwright-report/
