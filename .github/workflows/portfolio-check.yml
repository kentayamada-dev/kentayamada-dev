name: portfolio の型・静的解析・ビルド

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  portfolio-check:
    name: portfolio-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # Node.js と pnpm の版を portfolio の Dockerfile だけで管理するため、Dev Container と同じイメージのなかで検査する。
      # Dockerfile の ARG の値は compose.yaml から渡すため、docker build ではなく Compose でビルドする
      - run: docker compose build portfolio
      - run: docker compose run --rm portfolio pnpm install --frozen-lockfile
      # コンテナの dev の uid はランナーの uid と一致するとは限らないため、どの uid でも .astro や dist を作れるようにする
      - run: chmod a+w portfolio
      # 検証用: 古い baseline-browser-mapping（web-features 3.38.0）と今の版で、baseline newly available と同じ条件の範囲を比べる
      - run: |
          cat > portfolio/bbm-probe.mjs <<'EOF'
          import { readdirSync } from "node:fs";
          import { resolve } from "node:path";
          import { pathToFileURL } from "node:url";

          const load = (dir) => import(pathToFileURL(resolve(dir, "dist/index.js")).href);
          const currentDir = readdirSync("node_modules/.pnpm").find((name) => name.startsWith("baseline-browser-mapping@"));
          const current = await load(`node_modules/.pnpm/${currentDir}/node_modules/baseline-browser-mapping`);
          const old = await load("/tmp/bbm-old/node_modules/baseline-browser-mapping");
          // browserslist 4.29.6 の baseline newly available と同じ条件
          const options = { widelyAvailableOnDate: new Date().setMonth(new Date().getMonth() + 30), suppressWarnings: true };
          const show = (versions) => versions.map((v) => `${v.browser} ${v.version}`).join(", ");
          console.log("今:", currentDir);
          console.log(show(current.getCompatibleVersions(options)));
          console.log("古い: baseline-browser-mapping 2.11.24");
          console.log(show(old.getCompatibleVersions(options)));
          EOF
          docker compose run --rm portfolio sh -c 'npm install --no-save --prefix /tmp/bbm-old --registry=https://npm.flatt.tech/ baseline-browser-mapping@2.11.24 && node bbm-probe.mjs'
          rm portfolio/bbm-probe.mjs
      - run: docker compose run --rm portfolio pnpm fmt:check
      - run: docker compose run --rm portfolio pnpm lint
      # astro build は型を検査せず、型の誤りがあってもビルドが通るため、別のステップで検査する
      # https://docs.astro.build/en/guides/typescript/#type-checking
      - run: docker compose run --rm portfolio pnpm typecheck
      - run: docker compose run --rm portfolio pnpm knip
      # 整形・lint・型の検査が通っても、ビルドでページを事前にレンダリングするときに初めて失敗することもある
      - run: docker compose run --rm portfolio pnpm build
