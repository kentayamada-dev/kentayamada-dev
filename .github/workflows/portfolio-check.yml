name: portfolio の型・静的解析・ビルド

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# 同じ PR に push し直したら古い実行を取り消す。PR 以外は実行ごとにグループを分け、待っている実行も後から来た実行に取り消されないようにする
# https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/control-workflow-concurrency
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  portfolio-check:
    name: portfolio-check
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # 後のステップで git の認証を使わないため、資格情報をディスクに残さない https://docs.zizmor.sh/audits/#artipacked
          persist-credentials: false
      # Node.js と pnpm の版を portfolio の Dockerfile だけで管理するため、Dev Container と同じイメージのなかで検査する。
      # Dockerfile の ARG の値は compose.yaml から渡すため、docker build ではなく Compose でビルドする
      - run: docker compose build portfolio
      - run: docker compose run --rm portfolio pnpm install --frozen-lockfile
      # コンテナの dev の uid はランナーの uid と一致するとは限らないため、どの uid でも .astro や dist を作れるようにする
      - run: chmod a+w portfolio
      - run: docker compose run --rm portfolio pnpm fmt:check
      - run: docker compose run --rm portfolio pnpm lint
      # astro build は型を検査せず、型の誤りがあってもビルドが通るため、別のステップで検査する
      # https://docs.astro.build/en/guides/typescript/#type-checking
      - run: docker compose run --rm portfolio pnpm typecheck
      - run: docker compose run --rm portfolio pnpm knip
      # 整形・lint・型の検査が通っても、ビルドでページを事前にレンダリングするときに初めて失敗することもある
      - run: docker compose run --rm portfolio pnpm build
      # 検証用: 縮小しないビルドの CSS を、cssTarget の targets（A）と Android を含む範囲全体の targets（B）で縮小して比べる
      - run: |
          cat > portfolio/astro.probe.config.mjs <<'EOF'
          import config from "./astro.config.ts";
          export default {
            ...config,
            outDir: "./dist-unminified",
            vite: { ...config.vite, build: { ...config.vite.build, cssMinify: false } },
          };
          EOF
          cat > portfolio/probe.mjs <<'EOF'
          import { readdirSync, readFileSync } from "node:fs";
          import { createRequire } from "node:module";
          import { resolve } from "node:path";
          import browserslist from "browserslist";
          import config from "./astro.config.ts";

          // portfolio は vite を直接には依存しないので、pnpm の置き場所の vite から、Vite と同じ lightningcss を読み込む
          const viteDir = readdirSync("node_modules/.pnpm").find((name) => name.startsWith("vite@8.3.8"));
          console.log("vite:", viteDir);
          const require = createRequire(resolve(`node_modules/.pnpm/${viteDir}/node_modules/vite/package.json`));
          const { transform, browserslistToTargets } = require("lightningcss");
          const lightningcssPath = require.resolve("lightningcss");
          console.log("lightningcss:", lightningcssPath);

          // Vite 8.3.8 の convertTargets と同じ変換
          const map = { chrome: "chrome", edge: "edge", firefox: "firefox", ie: "ie", ios: "ios_saf", opera: "opera", safari: "safari" };
          const targetsA = {};
          for (const entry of config.vite.build.cssTarget) {
            const index = entry.search(/\d/);
            const browser = map[entry.slice(0, index)];
            const [major, minor = 0] = entry.slice(index).split(".").map((v) => Number.parseInt(v, 10));
            const version = (major << 16) | (minor << 8);
            if (!targetsA[browser] || version < targetsA[browser]) targetsA[browser] = version;
          }
          const targetsB = browserslistToTargets(browserslist());
          const targetsC = { ...targetsA, safari: 15 << 16, ios_saf: 15 << 16 };
          const show = (t) => Object.entries(t).map(([k, v]) => `${k} ${v >> 16}.${(v >> 8) & 255}`).join(", ");
          console.log("browserslist:", browserslist().join(", "));
          console.log("A:", show(targetsA));
          console.log("B:", show(targetsB));
          console.log("C:", show(targetsC));

          const read = (dir) => {
            const files = readdirSync(dir).filter((name) => name.endsWith(".css"));
            if (files.length !== 1) throw new Error(`${dir} の CSS が 1 つではない: ${files.join(", ")}`);
            return readFileSync(`${dir}/${files[0]}`);
          };
          const source = read("dist-unminified/_astro");
          const normal = read("dist/_astro").toString();
          const minify = (targets) =>
            new TextDecoder().decode(transform({ targets, filename: "global.css", code: source, minify: true }).code) + "\n";
          const [outA, outB, outC] = [minify(targetsA), minify(targetsB), minify(targetsC)];
          console.log("bytes: source", source.length, "normal", normal.length, "A", outA.length, "B", outB.length, "C", outC.length);
          console.log("A と普段のビルドが同じ:", outA === normal);
          console.log("A と B が同じ:", outA === outB);
          console.log("A と C（対照）が同じ:", outA === outC);
          EOF
          docker compose run --rm portfolio pnpm astro build --config astro.probe.config.mjs
          docker compose run --rm portfolio node probe.mjs
