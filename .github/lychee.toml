include_fragments = "anchor-only"
no_progress = true
require_https = true

# テストのサーバーの URL（127.0.0.1 など）は、設定やコードに書くもので、リンクではないため
# https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee.example.toml?plain=1#L182-L183
exclude_loopback = true

# 渡したグロブの * と ** は、デフォルトでは . で始まるファイルとディレクトリに一致せず、.github などを見落とすため
# https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee-lib/src/types/input/resolver.rs#L121-L123
hidden = true

# 既定の 20 秒では、gnu.org のマニュアルなど応答の遅いサイトが打ち切られ、外部リンクの検査が失敗することがあったため。
# 再試行（既定で 3 回）ごとにこの時間まで待つので、変えるときは lychee.yml の lychee-external の timeout-minutes に収まるようにする
# https://github.com/lycheeverse/lychee/blob/lychee-v0.24.2/lychee-lib/src/client.rs#L44-L48
timeout = 60

exclude_path = [
  # hidden を有効にすると、グロブが .git のなかにも一致するため
  '^\.git/',
  # mise.lock と uv.lock の URL は mise lock と uv lock が書くもので、手で直さないため
  '^\.github/mise\.lock$',
  '^\.github/yamllint/uv\.lock$',
  '^\.github/check-jsonschema/uv\.lock$',
  # n8n のワークフローの URL は、n8n の式（{{ }}）を含むものや、ログインの要る API・Google Drive を指すもので、開けないため
  '^infra/workflows/',
]

# lychee はこのファイルも検査し、正規表現に :// を書くと、そこから linkify が URL を切り出して開けないと報告するので、/ は \/ と書く
# https://github.com/robinst/linkify/blob/0.11.0/src/url.rs#L40-L43 https://github.com/rust-lang/regex/blob/1.12.3/CHANGELOG.md?plain=1#L555-L559
exclude = [
  # osv.dev の URL は ID を埋めて作るもので、リポジトリには ID を埋める前の jq の式とテストの架空の ID の URL しかなく、開けないため。
  # linkify は \ を URL の文字として扱い、jq の \( も URL に含めて切り出す https://github.com/robinst/linkify/blob/0.11.0/src/url.rs#L219-L225
  '^https:\/\/osv\.dev\/',
  # Takumi Guard のレジストリの URL は、pnpm と npm に渡すもので、ページではなく、開くと 400 を返すため
  '^https:\/\/npm\.flatt\.tech\/$',
  # create-renovate-app.bats のスタブと期待値に書いた GitHub App と別のリポジトリの URL は、テストのための値で、開けないため
  '^https:\/\/github\.com\/apps\/kentayamada-dev-renovate(\/|$)',
  '^https:\/\/github\.com\/someone\/other$',
  # Cloudflare Tunnel の転送先の n8n は、Compose のネットワークのなかのホスト名で、外からは開けないため
  '^http:\/\/n8n:5678\/?$',
]
