# USER_NAME を変えるときは、すべての devcontainer.json の remoteUser と、infra の .oci のマウント先も合わせる
x-build-args: &build-args
  USER_NAME: dev
  HISTORY_DIR: &history-dir /commandhistory

# Dev Container のサービスは、これを <<: で取り込む
x-devcontainer: &devcontainer
  # Compose では overrideCommand が既定で false で、イメージの CMD は端末がないとすぐ終了するため
  # https://containers.dev/implementors/json_reference/
  command: sleep infinity

# コンテナのなかでも git を使えるよう、.git のあるリポジトリのルートをマウントする
# https://code.visualstudio.com/remote/advancedcontainers/connect-multiple-containers
x-workspace-volume: &workspace-volume .:/workspace

services:
  portfolio:
    <<: *devcontainer
    build:
      context: .devcontainer/portfolio
      args:
        <<: *build-args
        NODE_MODULES_DIR: &node-modules-dir /workspace/portfolio/node_modules
    # 既定のホスト名はコンテナ ID で、端末のプロンプトからどちらのコンテナかわからないため
    hostname: portfolio
    # docker compose run を、--workdir を付けなくてもプロジェクトのディレクトリで動かすため
    working_dir: /workspace/portfolio
    volumes:
      - *workspace-volume
      # macOS のバインドマウントは、インストールのように書き込みの多い処理が遅いため
      # https://code.visualstudio.com/remote/advancedcontainers/improve-performance
      - type: volume
        source: portfolio-node-modules
        target: *node-modules-dir
      # コンテナを作り直しても bash の履歴を残すため
      # https://code.visualstudio.com/remote/advancedcontainers/persist-bash-history
      - type: volume
        source: portfolio-history
        target: *history-dir
    environment:
      ASTRO_TELEMETRY_DISABLED: 1

  # portfolio のテストからつなぐ、Playwright のブラウザのサーバー。ブラウザと OS の依存は、公式のイメージに入っている
  # https://github.com/microsoft/playwright/blob/v1.65.1/docs/src/docker.md#remote-connection
  playwright:
    # タグの書き方を変えるときは、.github/renovate.json5 の customManagers の matchStrings も合わせる
    image: mcr.microsoft.com/playwright:v1.65.1-noble
    # テストとサーバーの Playwright の版をそろえるため、npx で取得せず、portfolio の node_modules にある Playwright で動かす。
    # ほかのコンテナからつなぐため、すべてのアドレスで待ち受ける。ports で公開しないので、届くのは Compose のネットワークのなかだけ
    # https://github.com/microsoft/playwright/blob/v1.65.1/docs/src/docker.md?plain=1#L189-L191
    command:
      - sh
      - -c
      - exec node_modules/.bin/playwright run-server --port "$$SERVER_PORT" --host 0.0.0.0
    working_dir: /workspace/portfolio
    environment:
      # 変えるときは、portfolio/playwright.config.ts の connectOptions も合わせる
      SERVER_PORT: 3000
    # イメージの既定の root でブラウザを動かさないよう、イメージにある一般ユーザーで動かす
    # https://github.com/microsoft/playwright/blob/v1.65.1/docs/src/docker.md?plain=1#L38
    user: pwuser
    # PID 1 で動かすと、終わったブラウザのプロセスが回収されずに残ることがあるため
    # https://github.com/microsoft/playwright/blob/v1.65.1/docs/src/docker.md?plain=1#L101
    init: true
    # Chromium は、Docker の既定の共有メモリでは足りずに落ちることがあるため
    # https://github.com/microsoft/playwright/blob/v1.65.1/docs/src/docker.md?plain=1#L103
    ipc: host
    volumes:
      - type: volume
        source: portfolio-node-modules
        target: *node-modules-dir
        read_only: true
    # docker compose up --wait は、ヘルスチェックがないとコンテナが動き出した時点で戻り、サーバーが待ち受ける前にテストがつなぎに行くため。
    # 既定では最初の検査まで 30 秒待つため、起動中は 1 秒ごとに検査させる
    # https://docs.docker.com/reference/compose-file/services/#healthcheck
    healthcheck:
      test:
        - CMD-SHELL
        - curl --fail --silent --output /dev/null "http://127.0.0.1:$$SERVER_PORT/"
      start_period: 30s
      start_interval: 1s

  infra:
    <<: *devcontainer
    build:
      context: .devcontainer/infra
      args: *build-args
    hostname: infra
    working_dir: /workspace/infra/terraform
    volumes:
      - *workspace-volume
      - type: volume
        source: infra-history
        target: *history-dir
      # OCI の provider と backend は ~/.oci/config の API キーで認証する。CI のようにホストにないときは空のディレクトリを作る
      - type: bind
        source: ~/.oci
        target: /home/dev/.oci
        read_only: true
        bind:
          create_host_path: true
    environment:
      # 版は Renovate で上げるため、新しい版の確認で HashiCorp の Checkpoint に問い合わせさせない
      # https://developer.hashicorp.com/terraform/cli/commands#upgrade-and-security-bulletin-checks
      CHECKPOINT_DISABLE: 1
      # Cloudflare の provider が読むトークンを、ホストの環境変数から渡す。ホストで設定していなければ渡さない
      CLOUDFLARE_API_TOKEN:

volumes:
  portfolio-node-modules:
  portfolio-history:
  infra-history:
